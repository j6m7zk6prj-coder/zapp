# Projet Xcode généré par XcodeGen : `xcodegen generate`
name: Zapp

options:
  bundleIdPrefix: app.zapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Mets ici ton Team ID Apple (Xcode > Signing & Capabilities) ou choisis-le dans Xcode.
    DEVELOPMENT_TEAM: ""

targets:
  Zapp:
    type: application
    platform: iOS
    sources:
      - path: Zapp
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Zapp TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # Beaucoup de flux IPTV sont en http:// : on autorise le chargement non chiffré.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zapp.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ZappTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZappTests
    dependencies:
      - target: Zapp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.zapp.ios.tests

schemes:
  Zapp:
    build:
      targets:
        Zapp: all
        ZappTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ZappTests
