name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests (simulateur)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile') }}

      - name: Installer les dépendances (MobileVLCKit)
        run: pod install

      - name: Choisir un simulateur iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Simulateur : $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Lancer les tests
        run: |
          xcodebuild test -quiet \
            -workspace Zapp.xcworkspace \
            -scheme Zapp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    name: IPA non signée
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile') }}

      - name: Installer les dépendances (MobileVLCKit)
        run: pod install

      - name: Compiler pour iPhone (sans signature)
        run: |
          xcodebuild build -quiet \
            -workspace Zapp.xcworkspace \
            -scheme Zapp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Zapp.app Payload/
          zip -qr Zapp-unsigned.ipa Payload
          ls -lh Zapp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Zapp-unsigned-ipa
          path: Zapp-unsigned.ipa
          retention-days: 14
