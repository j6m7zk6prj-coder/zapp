name: Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, compilation et Release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests du cœur (parser, Xtream, liens)
        run: dotnet test windows/ZappTV.Tests/ZappTV.Tests.csproj -c Release --nologo

      - name: Compiler l'app (autonome, Windows x64)
        run: |
          dotnet publish windows/ZappTV/ZappTV.csproj -c Release -r win-x64 --self-contained true \
            -p:DebugType=none -p:GenerateDocumentationFile=false -o out/ZappTV --nologo
          ls out/ZappTV | head -50

      - name: Créer le zip
        shell: pwsh
        run: |
          Copy-Item windows/LISEZ-MOI.txt out/ZappTV/
          Compress-Archive -Path out/ZappTV -DestinationPath ZappTV-Windows-x64.zip
          Get-Item ZappTV-Windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ZappTV-Windows-x64
          path: ZappTV-Windows-x64.zip
          retention-days: 14

      # Release « windows-latest » : lien de téléchargement fixe, mis à jour à chaque version.
      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' windows/Directory.Build.props | head -1)
          gh release delete windows-latest --cleanup-tag --yes || true
          {
            echo "Zapp TV pour Windows ${VERSION} (build ${{ github.run_number }})"
            echo
            echo "1. Télécharge **ZappTV-Windows-x64.zip** ci-dessous et dézippe-le."
            echo "2. Lance **ZappTV.exe** dans le dossier ZappTV."
            echo "3. Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*."
            echo
            echo "Commit : ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)"
          } > notes.md
          gh release create windows-latest ZappTV-Windows-x64.zip \
            --title "Zapp TV pour Windows ${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest=false
