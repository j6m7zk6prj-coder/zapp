name: Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, compilation et Release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests du cœur (parser, Xtream, liens)
        run: dotnet test windows/ZappTV.Tests/ZappTV.Tests.csproj -c Release --nologo

      - name: Compiler l'app (autonome, Windows x64)
        run: |
          dotnet publish windows/ZappTV/ZappTV.csproj -c Release -r win-x64 --self-contained true \
            -p:DebugType=none -p:GenerateDocumentationFile=false -o out/ZappTV --nologo
          ls out/ZappTV | head -50

      - name: Créer le zip
        shell: pwsh
        run: |
          Copy-Item windows/LISEZ-MOI.txt out/ZappTV/
          Compress-Archive -Path out/ZappTV -DestinationPath ZappTV-Windows-x64.zip
          Get-Item ZappTV-Windows-x64.zip | Select-Object Name, Length

      # Un seul fichier ZappTV.exe qui contient tout (.NET + VLC), extrait au premier lancement.
      - name: Compiler ZappTV.exe (fichier unique)
        run: |
          dotnet publish windows/ZappTV/ZappTV.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:GenerateDocumentationFile=false -o out/single --nologo
          ls -la out/single

      - name: Zapp TV pour Windows (ZappTV.exe à lancer)
        uses: actions/upload-artifact@v4
        with:
          name: ZappTV-Windows-exe
          path: out/single/ZappTV.exe
          retention-days: 30

      # Release « windows-latest » : lien de téléchargement fixe, mis à jour à chaque version.
      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' windows/Directory.Build.props | head -1)
          gh release delete windows-latest --cleanup-tag --yes || true
          {
            echo "Zapp TV pour Windows ${VERSION} (build ${{ github.run_number }})"
            echo
            echo "- **ZappTV.exe** : un seul fichier, télécharge-le et double-clique (le premier lancement prend quelques secondes)."
            echo "- **ZappTV-Windows-x64.zip** : même app en dossier, à dézipper puis lancer ZappTV.exe."
            echo
            echo "Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*."
            echo
            echo "Commit : ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)"
          } > notes.md
          gh release create windows-latest out/single/ZappTV.exe ZappTV-Windows-x64.zip \
            --title "Zapp TV pour Windows ${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest=false

      # Branche « app-windows » : l'app dézippée, directement dans le dépôt (chaque fichier < 100 Mo).
      # Remplacée à chaque version (pas d'historique), pour ne pas alourdir le dépôt.
      - name: Publier l'app dans la branche app-windows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIG=$(find out/ZappTV -type f -size +95M)
          if [ -n "$BIG" ]; then echo "Fichier trop gros pour GitHub : $BIG"; exit 1; fi
          mkdir branch && cp -r out/ZappTV branch/
          cd branch
          cat > README.md <<'MD'
          # Zapp TV pour Windows — app prête à lancer

          **Télécharger :** bouton vert **Code** → **Download ZIP**, puis dézippe et lance `ZappTV/ZappTV.exe`.

          Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.

          Cette branche est générée automatiquement par GitHub Actions à chaque mise à jour.
          Le code source est sur la branche `main`.
          MD
          sed -i 's/^          //' README.md
          git init -q -b app-windows
          git config core.autocrlf false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Zapp TV pour Windows (build ${{ github.run_number }}, ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" app-windows
          echo "Publié : https://github.com/${{ github.repository }}/tree/app-windows"
