name: Sonde données foot

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN — détails
        run: |
          set +e
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          C="curl -s --compressed -A Mozilla/5.0"
          echo "=== all/scoreboard 20261108 ==="
          $C "$B/all/scoreboard?dates=20261108" -o all.json
          jq -c '{keys: keys, leaguesN: (.leagues|length), leagues: [.leagues[]? | {id, slug, abbreviation, name}][0:6]}' all.json
          jq -c '.events[0] | {keys: keys, id, date, name, season, league: .league?, uid, compKeys: (.competitions[0]|keys), status: .status.type | {state, completed, detail, shortDetail, name}, clock: .status.displayClock, broadcasts: .competitions[0].broadcasts, geo: [.competitions[0].geoBroadcasts[]? | {mkt: .market.type, media: .media.shortName, type: .type.shortName}], details: [.competitions[0].details[]? | {t: .type.text, c: .clock.displayValue, team: .team.id, a: [.athletesInvolved[]?.displayName], scoringPlay, redCard, yellowCard}][0:4], comp: [.competitions[0].competitors[] | {id, homeAway, score, winner, form, records: [.records[]?.summary], team: .team | {id, displayName, shortDisplayName, abbreviation, logo, color}}], venue: .competitions[0].venue.fullName, links: [.links[]?.href][0:1]}' all.json
          echo "=== fra.1 dates=20261108 ==="
          $C "$B/fra.1/scoreboard?dates=20261108" | jq -c '{n: (.events|length), d: [.events[] | {id, date, name, st: .status.type.state}]}'
          echo "=== fra.1 dates=202611 (mois) ==="
          $C "$B/fra.1/scoreboard?dates=202611" | jq -c '{n: (.events|length), err: .message?}'
          EV=$(jq -r '[.events[] | select(.status.type.completed)][0].id' all.json)
          SLUG=$(jq -r --arg ev "$EV" '.events[] | select(.id==$ev) | .uid' all.json)
          echo "=== event $EV uid $SLUG ==="
          for L in fra.1 eng.1 esp.1 ita.1 ger.1; do
            $C "$B/$L/summary?event=$EV" -o sum.json
            OK=$(jq -r 'has("boxscore")' sum.json); echo "$L summary has boxscore: $OK"
            if [ "$OK" = "true" ]; then break; fi
          done
          jq -c 'keys' sum.json
          jq -c '.boxscore.teams[] | {team: .team.displayName, logo: .team.logo, stats: [.statistics[] | {name, label, displayValue}]}' sum.json | head -c 2500; echo
          jq -c '[.keyEvents[]? | {type: .type.text, typeId: .type.type, clock: .clock.displayValue, team: .team.displayName, short: .shortText, scoringPlay, participants: [.participants[]?.athlete.displayName]}][0:10]' sum.json | head -c 2500; echo
          jq -c '[.rosters[]? | {team: .team.displayName, homeAway, formation, n: (.roster|length), players: [.roster[]? | {starter, jersey, name: .athlete.displayName, pos: .position.abbreviation, subbedIn, subbedOut}][0:2]}]' sum.json | head -c 1500; echo
          jq -c '.header | {league: .league | {slug, abbreviation, name}, comp: .competitions[0] | {date, status: .status.type | {state, detail}, competitors: [.competitors[] | {homeAway, score, team: .team | {id, displayName, logo: .logos[0].href}}]}}' sum.json | head -c 1500; echo
          jq -c '.standings.groups[0] | {header, n: (.standings.entries|length), first: .standings.entries[0] | {team, stats: [.stats[] | {name, displayValue}]}}' sum.json | head -c 1500; echo
          jq -c '{gameInfo: .gameInfo | {venue: .venue.fullName, attendance, officials: [.officials[]?.displayName]}, broadcasts, odds: (.odds|length)?, h2h: (.headToHeadGames|length)?, news: (.news.articles|length)?}' sum.json | head -c 800; echo
          echo "=== équipes : calendrier fixture toutes compétitions ? ==="
          $C "$B/all/teams/160/schedule?fixture=true" | jq -c '{n: (.events|length), err: .message?, leagues: [.events[]?.league?.slug?] | unique}'
          $C "$B/fra.1/teams/160/schedule?fixture=true" | jq -c '{n: (.events|length), sample: [.events[0:3][] | {date, name, league: .league?.abbreviation?, seasonType: .seasonType?.name?}]}'
          echo "=== ligues : nb matchs le 20261108 / 20261105 ==="
          for L in eng.1 esp.1 ita.1 ger.1 fra.2 uefa.champions uefa.europa uefa.europa.conf fra.coupe_de_france por.1 ned.1 bel.1 tur.1 sco.1 usa.1 ksa.1 bra.1 arg.1 mex.1 eng.2 eng.fa eng.league_cup esp.copa_del_rey ita.coppa_italia ger.dfb_pokal uefa.nations fifa.world fifa.worldq.uefa fifa.friendly uefa.euro caf.nations conmebol.libertadores fifa.cwc; do
            A=$($C "$B/$L/scoreboard?dates=20261108" | jq -r '"\(.leagues[0].name // "?") \(.events|length)"')
            Bv=$($C "$B/$L/scoreboard?dates=20261105" | jq -r '.events|length')
            echo "$L : $A / $Bv"
          done
          echo "=== logo ligue ==="
          $C "$B/fra.1/scoreboard" | jq -c '.leagues[0].logos'
