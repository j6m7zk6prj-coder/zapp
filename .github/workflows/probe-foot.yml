name: Sonde données foot

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN — scoreboard, résumé, classement, équipes
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          echo "=== scoreboard fra.1 (plage de dates) ==="
          curl -s "$B/fra.1/scoreboard?dates=20261101-20261115" -o sb.json
          jq -c '{keys: keys, league: (.leagues[0] | {id, name, abbreviation, slug, logos: [.logos[0].href]}), n: (.events|length)}' sb.json
          jq -c '.events[0] | {id, date, name, shortName, status: {clock: .status.displayClock, period: .status.period, type: .status.type | {state, completed, detail, shortDetail, description}}, comp: .competitions[0] | {venue: .venue.fullName, broadcasts, geoBroadcasts: [.geoBroadcasts[]? | {market: .market.type, media: .media.shortName}], details: [.details[]? | {type: .type.text, clock: .clock.displayValue, team: .team.id, athletes: [.athletesInvolved[]?.displayName]}], competitors: [.competitors[] | {id, homeAway, score, winner, form, team: .team | {id, displayName, shortDisplayName, abbreviation, logo, color}}]}}' sb.json
          EV=$(jq -r '[.events[] | select(.status.type.completed)][0].id' sb.json)
          echo "=== summary event $EV ==="
          curl -s "$B/fra.1/summary?event=$EV" -o sum.json
          jq -c 'keys' sum.json
          jq -c '.boxscore.teams[0] | {team: .team.displayName, stats: [.statistics[] | {name, label, displayValue}]}' sum.json
          jq -c '[.keyEvents[]? | {type: .type.text, clock: .clock.displayValue, team: .team.displayName, text: .text, short: .shortText, participants: [.participants[]?.athlete.displayName]}][0:8]' sum.json
          jq -c '[.rosters[]? | {team: .team.displayName, formation: .formation, players: [.roster[]? | {starter, jersey, name: .athlete.displayName, pos: .position.abbreviation, subbedIn, subbedOut}][0:3]}]' sum.json
          jq -c '.header.competitions[0] | {date, status: .status.type.detail, competitors: [.competitors[] | {homeAway, score, team: .team.displayName}]}' sum.json
          jq -c '.standings | {keys: keys?, first: .groups[0]?.standings.entries[0]? }' sum.json | head -c 1500; echo
          echo "=== standings ==="
          curl -s "https://site.api.espn.com/apis/v2/sports/soccer/fra.1/standings" -o st.json
          jq -c '{keys: keys, childrenN: (.children|length), name: .children[0].name}' st.json
          jq -c '.children[0].standings.entries[0] | {team: .team | {id, displayName, abbreviation, logo: .logos[0].href}, note, stats: [.stats[] | {name, abbreviation, type, displayValue}]}' st.json
          echo "=== teams ==="
          curl -s "$B/fra.1/teams" -o tm.json
          jq -c '.sports[0].leagues[0].teams[0].team | {id, displayName, shortDisplayName, abbreviation, logo: .logos[0].href, color}' tm.json
          jq -c '.sports[0].leagues[0].teams | length' tm.json
          TID=$(jq -r '.sports[0].leagues[0].teams[0].team.id' tm.json)
          echo "=== team schedule $TID (fixture) ==="
          curl -s "$B/fra.1/teams/$TID/schedule?fixture=true" -o ts.json
          jq -c '{keys: keys, n: (.events|length), first: .events[0] | {id, date, name, league: .league?.slug?, comps: .competitions[0].competitors[0].team.displayName}}' ts.json
          curl -s "$B/fra.1/teams/$TID/schedule" -o ts2.json
          jq -c '{n: (.events|length), first: .events[0] | {id, date, name, score: [.competitions[0].competitors[] | .score]}}' ts2.json
          echo "=== autres ligues (nb matchs sur la plage) ==="
          for L in eng.1 esp.1 ita.1 ger.1 uefa.champions uefa.europa uefa.europa.conf fra.2 fra.coupe_de_france por.1 ned.1 fifa.world fifa.worldq.uefa uefa.nations usa.1 ksa.1 fifa.cwc eng.fa esp.copa_del_rey; do
            N=$(curl -s "$B/$L/scoreboard?dates=20261101-20261130" | jq '.events | length' 2>/dev/null)
            echo "$L : $N"
          done
          echo "=== scoreboard tous sports soccer/all ? ==="
          curl -s "$B/all/scoreboard?dates=20261109" | jq -c '{n: (.events|length)?, err: .error?}' 2>&1 | head -c 300; echo
